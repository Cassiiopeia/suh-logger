<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="268" viewBox="0 0 1160 268">
<title>suh-logger before and after</title>
<rect width="1160" height="268" fill="none"/>
<g transform="translate(10,40)"><g><rect width="560" height="218" rx="10" fill="#0d1117" stroke="#30363d"/>
<circle cx="20" cy="20" r="6" fill="#ff5f56"/><circle cx="40" cy="20" r="6" fill="#ffbd2e"/><circle cx="60" cy="20" r="6" fill="#27c93f"/>
<text x="280.0" y="25" fill="#8b949e" font-size="13" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif">suh-logger 2.x  —  default settings</text>
<text x="18" y="58" fill="#8b949e" font-size="13.5" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">@LogMonitor login(LoginRequest request)</text>
<text x="18" y="80" fill="#c9d1d9" font-size="13.5" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve"></text>
<text x="18" y="102" fill="#ff7b72" font-size="13.5" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">LoginResponse@7ef27d7f</text>
<text x="18" y="124" fill="#ff7b72" font-size="13.5" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">TokenRecord[refreshToken=RT-9]</text>
<text x="18" y="146" fill="#c9d1d9" font-size="13.5" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve"></text>
<text x="18" y="168" fill="#8b949e" font-size="13.5" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve"># DTOs fall back to toString(): secrets are printed,</text>
<text x="18" y="190" fill="#8b949e" font-size="13.5" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve"># or you get an object address and no data at all.</text>
</g></g>
<g transform="translate(590,40)"><g><rect width="560" height="218" rx="10" fill="#0d1117" stroke="#30363d"/>
<circle cx="20" cy="20" r="6" fill="#ff5f56"/><circle cx="40" cy="20" r="6" fill="#ffbd2e"/><circle cx="60" cy="20" r="6" fill="#27c93f"/>
<text x="280.0" y="25" fill="#8b949e" font-size="13" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif">suh-logger 3.x  —  default settings</text>
<text x="18" y="58" fill="#8b949e" font-size="13.5" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">@LogMonitor login(LoginRequest request)</text>
<text x="18" y="80" fill="#c9d1d9" font-size="13.5" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve"></text>
<text x="18" y="102" fill="#7ee787" font-size="13.5" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">{ &quot;request&quot;: { &quot;username&quot;: &quot;suh&quot;, &quot;password&quot;: &quot;****&quot; } }</text>
<text x="18" y="124" fill="#7ee787" font-size="13.5" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">{ &quot;username&quot;: &quot;suh&quot;, &quot;accessToken&quot;: &quot;****&quot;,</text>
<text x="18" y="146" fill="#7ee787" font-size="13.5" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">  &quot;refreshToken&quot;: &quot;****&quot; }</text>
<text x="18" y="168" fill="#c9d1d9" font-size="13.5" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve"></text>
<text x="18" y="190" fill="#8b949e" font-size="13.5" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve"># Field-level JSON. Secrets are masked at any depth.</text>
</g></g>
<text x="290" y="26" fill="#cf222e" font-size="18" font-weight="600" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif">2.x</text>
<text x="870" y="26" fill="#1a7f37" font-size="18" font-weight="600" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif">3.x</text>
</svg>